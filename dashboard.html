<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullstack Plan — Learning App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f6f1; --card:#fffefb; --ink:#20261f; --muted:#6d746c;
  --line:#e3e1d6; --line-strong:#c9c7ba;
  --teal:#0f766e; --teal-soft:#e4f0ee; --teal-ink:#0b5a54;
  --amber:#a16207; --amber-soft:#faf3e3; --danger:#9f3b2f;
  --radius:10px; --maxw:820px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#12161a; --card:#1a2025; --ink:#e6e9e4; --muted:#8d968e;
    --line:#2a323a; --line-strong:#3b454e;
    --teal:#3fb8ad; --teal-soft:#173230; --teal-ink:#6fd3c9;
    --amber:#d4a24a; --amber-soft:#2e2718; --danger:#e07a6b;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed}
a{color:var(--teal);text-decoration:none} a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.brand{font-weight:700;letter-spacing:-.3px;font-size:1.05rem}
.brand small{font-weight:400;color:var(--muted);font-size:.8rem;margin-left:8px}
.utils{display:flex;gap:8px}
.util{background:none;border:1px solid var(--line-strong);border-radius:6px;color:var(--muted);font-size:.75rem;font-family:var(--mono);padding:4px 10px}
.util:hover{color:var(--ink);border-color:var(--ink)}
.statline{font-family:var(--mono);font-size:.78rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;padding:8px 0 14px;border-bottom:1px solid var(--line-strong)}
.statline b{color:var(--ink);font-weight:600}
.statline .behind{color:var(--danger)} .statline .ahead{color:var(--teal-ink)} .statline .fz{color:var(--amber)}
nav.tabs{display:flex;gap:4px;margin:14px 0 20px;flex-wrap:wrap}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:6px 12px;color:var(--muted);font-weight:500}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--teal)}
.page{display:none}.page.on{display:block}
.card{background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px}
.card h2{margin:0 0 8px;font-size:1.02rem;letter-spacing:-.2px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.eyebrow .ph{color:var(--teal-ink)}
#now{border-top:3px double var(--ink);padding-top:16px}
#now h1{margin:2px 0 8px;font-size:1.4rem;line-height:1.25;letter-spacing:-.4px}
.nav-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
.btn{background:var(--teal);color:#fff;border:none;border-radius:7px;padding:8px 16px;font-weight:600;font-size:.9rem}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line-strong);font-weight:500}
.btn.ghost:hover{border-color:var(--ink)}
.banner{border:1px solid var(--amber);background:var(--amber-soft);border-radius:8px;padding:10px 14px;font-size:.88rem;margin-bottom:16px}
.banner.behind{border-color:var(--danger);background:rgba(159,59,47,.08)}
.banner.ahead{border-color:var(--teal);background:var(--teal-soft)}
.brief{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0;font-size:.92rem}
.brief h3{margin:0 0 6px;font-size:.78rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.brief + .brief{margin-top:8px}
.brief p,.brief ol{margin:0} .brief ol{padding-left:20px}
.dim{margin:14px 0 6px}.dim-track{position:relative;height:34px}
.dim-line{position:absolute;left:0;right:0;top:16px;height:1px;background:var(--ink)}
.dim-fill{position:absolute;left:0;top:15px;height:3px;background:var(--teal);width:0%;max-width:100%}
.dim-lab{position:absolute;top:-6px;font-family:var(--mono);font-size:.66rem;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.dim-seg{position:absolute;top:22px;font-family:var(--mono);font-size:.66rem;color:var(--muted);transform:translateX(-50%)}
.dim-seg.cur{color:var(--teal-ink);font-weight:600}
.timer-row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.timer-clock{font-family:var(--mono);font-size:1.5rem;font-weight:600;min-width:96px}
.md h1{font-size:1.15rem;margin:14px 0 8px}.md h2{font-size:.98rem;margin:18px 0 6px}
.md p{margin:8px 0}.md ul,.md ol{margin:8px 0;padding-left:22px}
.md code{font-family:var(--mono);font-size:.84em;background:var(--teal-soft);color:var(--teal-ink);padding:1px 5px;border-radius:4px}
.md pre{background:var(--ink);color:var(--paper);padding:14px 16px;border-radius:8px;overflow-x:auto;font-size:.82rem}
.md pre code{background:none;color:inherit;padding:0}
textarea,input[type=text],input[type=url]{width:100%;background:var(--paper);border:1px solid var(--line-strong);border-radius:7px;color:var(--ink);font-family:inherit;font-size:.92rem;padding:9px 12px}
textarea{min-height:64px;resize:vertical}
label.small{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.donecheck{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.donecheck input{width:18px;height:18px;accent-color:var(--teal)}
.timeline{display:flex;gap:4px;margin:10px 0}
.tl-dot{flex:1;height:10px;border-radius:3px;background:var(--line);cursor:pointer}
.tl-dot.done{background:var(--teal)}
.tl-dot.cur{outline:2px solid var(--teal-ink);outline-offset:1px}
.syl-day{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.syl-day.viewing{background:var(--teal-soft);margin:0 -8px;padding:6px 8px;border-radius:6px}
.syl-day input{margin-top:3px;accent-color:var(--teal)}
.syl-day.done-d .syl-link{color:var(--muted);text-decoration:line-through}
.syl-link{background:none;border:none;padding:0;color:var(--teal);font:inherit;text-align:left;cursor:pointer}
.syl-link:hover{text-decoration:underline}
.muted{color:var(--muted)}.tiny{font-size:.8rem}
.ms-block{margin-bottom:18px}
.ms-block.cur-ms{outline:1px solid var(--teal);border-radius:8px;padding:10px;background:var(--teal-soft)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:8px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:520px){ #now h1{font-size:1.2rem} .card{padding:16px} }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">Fullstack Plan <small>AI-native AEC founder</small></div>
  <div class="utils">
    <button class="util" id="btn-export">Export progress</button>
    <button class="util" id="btn-import">Import</button>
    <input type="file" id="import-file" accept=".json" style="display:none">
  </div>
</header>
<div class="statline" id="statline"></div>
<nav class="tabs" id="tabs">
  <button data-p="today" class="on">Today</button>
  <button data-p="roadmap">Roadmap</button>
  <button data-p="projects">Projects</button>
  <button data-p="docs">Docs</button>
</nav>

<div class="page on" id="page-today">
  <div id="banner"></div>
  <div class="card" id="now"></div>
  <div class="card" id="timer-card">
    <h2>The 90-minute block</h2>
    <div class="dim" id="dim"></div>
    <div class="timer-row">
      <span class="timer-clock" id="clock">90:00</span>
      <button class="btn" id="t-start">Start session</button>
      <button class="btn ghost" id="t-reset">Reset</button>
      <span class="tiny muted" id="phase-tag"></span>
    </div>
  </div>
  <div class="card">
    <h2>Lesson</h2>
    <div class="md" id="lesson-body"><p class="muted">Select a day.</p></div>
  </div>
  <div class="card" id="log-card"></div>
  <div class="card" id="review-card" style="display:none"></div>
  <div class="card">
    <h2>Cursor prompts</h2>
    <p class="tiny muted">Pre-filled with this day and your last weak spots.</p>
    <div class="timer-row">
      <button class="btn ghost" id="p-quiz">Copy quiz prompt</button>
      <button class="btn ghost" id="p-gen">Copy generate-lessons prompt</button>
    </div>
  </div>
  <div class="card">
    <h2>Timeline · 12 milestones</h2>
    <div class="timeline" id="home-timeline"></div>
    <p class="tiny muted" id="home-tl-label"></p>
    <h2 style="margin-top:18px">This milestone · syllabus</h2>
    <div id="home-syllabus"></div>
  </div>
</div>

<div class="page" id="page-roadmap">
  <div class="card">
    <h2>Roadmap · 12 milestones</h2>
    <div id="rd-list"></div>
  </div>
</div>

<div class="page" id="page-projects">
  <div class="card">
    <h2>MVP (locked)</h2>
    <div id="mvp-box"></div>
  </div>
  <div id="proj-list"></div>
</div>

<div class="page" id="page-docs">
  <div class="card md" id="doc-body"></div>
</div>
</div>
<div class="toast" id="toast"></div>

,"id":"M12-D27","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-04-22","m":12,"n":28,"id":"M12-D28","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-04-23","m":12,"n":29,"id":"M12-D29","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-04-24","m":12,"n":30,"id":"M12-D30","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-04-26","m":12,"n":31,"id":"M12-D31","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-04-27","m":12,"n":32,"id":"M12-D32","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-04-28","m":12,"n":33,"id":"M12-D33","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-04-29","m":12,"n":34,"id":"M12-D34","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-04-30","m":12,"n":35,"id":"M12-D35","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-05-01","m":12,"n":36,"id":"M12-D36","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-05-03","m":12,"n":37,"id":"M12-D37","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-05-04","m":12,"n":38,"id":"M12-D38","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-05-05","m":12,"n":39,"id":"M12-D39","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-05-06","m":12,"n":40,"id":"M12-D40","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-05-07","m":12,"n":41,"id":"M12-D41","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true},{"date":"2027-05-08","m":12,"n":42,"id":"M12-D42","title":"Launch + consulting soft-launch","lesson":null,"synthetic":true}],"lessons":{"lessons/m01/d01.md":{"md":"# M1-D1 — Your toolbox: Node, Git, GitHub, Cursor\n\n## Today's summary\n\nYou install four tools and learn what each one is for — so nothing feels like magic for the next ten months.\n\n## What this is & why you need it\n\nSoftware needs a workshop (Node), a drawing register (Git), a shared CDE (GitHub), and a senior on call (Cursor). Today you set them up and verify they work.\n\n## How the session works (90 min)\n\n0:00–0:10 skim GETTING-STARTED §1 · 0:10–0:40 this lesson · 0:40–1:25 install & verify · 1:25–1:30 note versions in learning-log.md\n\n## Tool steps (do these in order)\n\n1. Open GETTING-STARTED.md in Cursor.\n2. Open terminal with Ctrl+` .\n3. Use **Ask** mode (not Agent) for questions.\n4. Disable Tab autocomplete in Cursor Settings.\n\n## The concept\n\nThink construction: the **browser** is the finished building people walk through. **Node.js** is the site workshop — JavaScript that runs on your machine, not only in a page. **Git** files revisions of the whole project locally. **GitHub** is the cloud copy of that register. **Cursor** is your tutor: Ask mode explains; Agent mode edits files — during Milestone 1 you stay in Ask for learning.\n\n\n## Where beginners go wrong\n\n1. Treating Git and GitHub as the same thing.\n2. Installing but never running `node -v` / `git --version`.\n3. Leaving Tab autocomplete on so the editor types your exercises for you.\n\n## Today's exercise\n\n**Exercise M1-D1** (also in PLAN.md): Install Node LTS, Git, GitHub account, Cursor Tab off. Self-check: `node -v` and `git --version` print versions; Ask mode answers a question.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"What's the difference between Git and GitHub, and what does Node let me do that a browser doesn't?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You install four tools and learn what each one is for — so nothing feels like magic for the next ten months.","process":"0:00–0:10 skim GETTING-STARTED §1 · 0:10–0:40 this lesson · 0:40–1:25 install & verify · 1:25–1:30 note versions in learning-log.md","tools":"1. Open GETTING-STARTED.md in Cursor.\n2. Open terminal with Ctrl+` .\n3. Use **Ask** mode (not Agent) for questions.\n4. Disable Tab autocomplete in Cursor Settings."},"lessons/m01/d02.md":{"md":"# M1-D2 — How the web works + first push\n\n## Today's summary\n\nYou push a real file to GitHub and can explain DNS → request → response → render in plain words.\n\n## What this is & why you need it\n\nEvery app you'll build is this loop. Until you can narrate it, deploy and debug feel like superstition.\n\n## How the session works (90 min)\n\nReview toolbox names · read lesson · create repo + index.html · push · write 5 sentences · Ask grades them\n\n## Tool steps (do these in order)\n\n1. File → Open Folder on your new project folder (not a parent).\n2. Create index.html in the explorer.\n3. Terminal for git commands.\n4. Browser → github.com to confirm the file.\n\n## The concept\n\nYou type a URL. **DNS** finds the server's address (like looking up a site address). The browser sends an **HTTP request**. The server sends an **HTTP response** (usually HTML). The browser **parses** HTML into a tree and paints pixels. Git **commit** snapshots your files; **push** uploads commits to GitHub.\n\n## Annotated example\n\n```\n<!-- index.html -->\n<!DOCTYPE html>           <!-- tells the browser: modern HTML -->\n<html lang=\"en\">          <!-- root of the document tree -->\n  <head>\n    <meta charset=\"UTF-8\" />\n    <title>Hello</title>  <!-- browser tab label -->\n  </head>\n  <body>\n    <h1>Hello, I'm Kshitij</h1>  <!-- visible content -->\n  </body>\n</html>\n```\n\n## Where beginners go wrong\n\n1. Editing files but forgetting `git add` before commit.\n2. Opening a parent folder in Cursor so paths and git root are wrong.\n3. Writing the 5 sentences with jargon you can't explain.\n\n## Today's exercise\n\n**Exercise M1-D2:** Create `learning-fullstack`, hand-write index.html, commit, push, write 5 sentences on the web pipeline in learning-log.md. Self-check: file visible on GitHub; Ask grades your sentences.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"Walk me through what happens between me pressing Enter on a URL and seeing a page.\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You push a real file to GitHub and can explain DNS → request → response → render in plain words.","process":"Review toolbox names · read lesson · create repo + index.html · push · write 5 sentences · Ask grades them","tools":"1. File → Open Folder on your new project folder (not a parent).\n2. Create index.html in the explorer.\n3. Terminal for git commands.\n4. Browser → github.com to confirm the file."},"lessons/m01/d03.md":{"md":"# M1-D3 — HTML document structure\n\n## Today's summary\n\nHTML is the load-bearing frame. Today you build a valid page from memory.\n\n## What this is & why you need it\n\nCSS and JavaScript decorate and animate; HTML is the structure. Wrong structure makes everything later harder.\n\n## How the session works (90 min)\n\nQuiz yourself on tags · read · type skeleton from memory · add content · Inspect check\n\n## Tool steps (do these in order)\n\n1. New file index.html (or continue yesterday's).\n2. Live Preview or open file in browser.\n3. Right-click → Inspect → Elements.\n4. Ask mode only for hints after 15 minutes.\n\n## The concept\n\nAn HTML document is a **tree of elements**. Tags mark the start and end of each element. Nesting must be clean — like a WBS: children close before parents. Headings `h1`–`h6` are outline levels, not font sizes.\n\n## Annotated example\n\n```\n<h1>Kshitij</h1>\n<p>I build web tools for AEC.</p>\n<ul>\n  <li>Grasshopper</li>\n  <li>Rhino</li>\n  <li>ShapeDiver</li>\n</ul>\n<a href=\"https://www.shapediver.com\" target=\"_blank\" rel=\"noopener\">ShapeDiver</a>\n```\n\n## Where beginners go wrong\n\n1. Using headings only to make text bigger.\n2. Forgetting closing tags (browsers forgive; bugs hide).\n3. Copy-pasting the whole file from Chat instead of typing.\n\n## Today's exercise\n\n**Exercise M1-D3:** From memory: skeleton + h1 + 2 paragraphs + list of 3 AEC tools + ShapeDiver link with target=_blank. Self-check: Elements tree matches intent.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"What are head and body for? I'll explain; correct me.\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"HTML is the load-bearing frame. Today you build a valid page from memory.","process":"Quiz yourself on tags · read · type skeleton from memory · add content · Inspect check","tools":"1. New file index.html (or continue yesterday's).\n2. Live Preview or open file in browser.\n3. Right-click → Inspect → Elements.\n4. Ask mode only for hints after 15 minutes."},"lessons/m01/d04.md":{"md":"# M1-D4 — Semantic HTML\n\n## Today's summary\n\nYou replace div soup with header/nav/main/footer so tools and humans understand the page.\n\n## What this is & why you need it\n\nScreen readers and search engines read structure. B2B products that ignore this feel amateur and exclude users.\n\n## How the session works (90 min)\n\nReview nesting · lesson · restructure page · image with alt · Ask audit (issues only)\n\n## Tool steps (do these in order)\n\n1. Edit HTML by hand.\n2. DevTools Accessibility pane.\n3. Ask: audit semantics — do not let Agent apply fixes.\n\n## The concept\n\n**Semantic** tags describe meaning: `header`, `nav`, `main`, `footer`, `section`. A `div` is a generic box — fine when nothing else fits. Images need `alt` text that describes purpose, not \"image1\".\n\n## Annotated example\n\n```\n<header>\n  <h1>Kshitij Nashine</h1>\n  <nav><a href=\"#projects\">Projects</a></nav>\n</header>\n<main id=\"projects\">...</main>\n<footer>Contact: you@email.com</footer>\n```\n\n## Where beginners go wrong\n\n1. Wrapping everything in divs out of habit.\n2. Empty alt or alt that repeats the caption uselessly.\n3. Multiple h1s competing as the page title.\n\n## Today's exercise\n\n**Exercise M1-D4:** Semantic landmarks + one image with meaningful alt. Self-check: landmarks in Accessibility tree; Ask lists issues only, you fix.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"When would you still use a plain div?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You replace div soup with header/nav/main/footer so tools and humans understand the page.","process":"Review nesting · lesson · restructure page · image with alt · Ask audit (issues only)","tools":"1. Edit HTML by hand.\n2. DevTools Accessibility pane.\n3. Ask: audit semantics — do not let Agent apply fixes."},"lessons/m01/d05.md":{"md":"# M1-D5 — Forms\n\n## Today's summary\n\nLabeled inputs — the skeleton of every lead form and waitlist you'll ship.\n\n## What this is & why you need it\n\nB2B apps collect structured input constantly. Unlabeled inputs break accessibility and your own sanity.\n\n## How the session works (90 min)\n\nRecall semantic tags · lesson · build inquiry form · test labels and email validation\n\n## Tool steps (do these in order)\n\n1. Type the form in HTML.\n2. Click labels to verify focus.\n3. Submit with bad email to see browser validation.\n\n## The concept\n\nA **form** groups controls. Every control needs a `<label>` (wrapping the control or using `for` + `id`). `type=\"email\"` gives free basic validation. `select` is for fixed option lists — like a dropdown in a door schedule.\n\n## Annotated example\n\n```\n<form>\n  <label for=\"name\">Name</label>\n  <input id=\"name\" name=\"name\" required />\n\n  <label for=\"email\">Email</label>\n  <input id=\"email\" name=\"email\" type=\"email\" required />\n\n  <label for=\"type\">Project type</label>\n  <select id=\"type\" name=\"type\">\n    <option>Facade</option>\n    <option>Structure</option>\n    <option>Fit-out</option>\n  </select>\n\n  <label for=\"msg\">Message</label>\n  <textarea id=\"msg\" name=\"msg\"></textarea>\n\n  <button type=\"submit\">Send</button>\n</form>\n```\n\n## Where beginners go wrong\n\n1. Placeholder text instead of a real label.\n2. Inputs without `name` (you'll need names when the server arrives).\n3. Button without type — can accidentally submit.\n\n## Today's exercise\n\n**Exercise M1-D5:** Inquiry form with name, email, select, textarea, submit; all labeled. Self-check: label click focuses; invalid email blocked.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"Why do labels matter if the placeholder already says Email?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"Labeled inputs — the skeleton of every lead form and waitlist you'll ship.","process":"Recall semantic tags · lesson · build inquiry form · test labels and email validation","tools":"1. Type the form in HTML.\n2. Click labels to verify focus.\n3. Submit with bad email to see browser validation."},"lessons/m01/d06.md":{"md":"# M1-D6 — Static room inventory skeleton\n\n## Today's summary\n\nYou build the HTML shell of the app Milestone 2 will make interactive.\n\n## What this is & why you need it\n\nSame pattern as a door schedule sheet: rows of data. Later JS will fill rows from an array; today you nail structure.\n\n## How the session works (90 min)\n\nQuick form recall · lesson · build room list shell · Inspect the ul/li\n\n## Tool steps (do these in order)\n\n1. New section or page `rooms.html` (or part of portfolio).\n2. Do not wire the Add button yet.\n3. Inspect to count li elements.\n\n## The concept\n\nHardcoded lists are scaffolding. Structure: heading, controls (input + button), `ul` of `li` items. Milestone 2 deletes the hardcoded `li`s and draws them from data.\n\n## Annotated example\n\n```\n<h1>Room inventory</h1>\n<input id=\"room-name\" placeholder=\"Room name\" />\n<input id=\"room-area\" type=\"number\" placeholder=\"Area m²\" />\n<button type=\"button\">Add</button>\n<ul>\n  <li>Lobby — 45 m²</li>\n  <li>Open office — 120 m²</li>\n  <li>Meeting A — 18 m²</li>\n</ul>\n```\n\n## Where beginners go wrong\n\n1. Using a button that submits a form and reloads the page (`type=\"button\"` prevents that).\n2. Putting area in a way you can't later parse (keep a clear pattern).\n3. Skipping the unordered list and using line breaks.\n\n## Today's exercise\n\n**Exercise M1-D6:** Room inventory skeleton with 3 hardcoded rooms. Self-check: one ul, three li.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"What will need to change in this HTML when we store rooms in a JavaScript array?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You build the HTML shell of the app Milestone 2 will make interactive.","process":"Quick form recall · lesson · build room list shell · Inspect the ul/li","tools":"1. New section or page `rooms.html` (or part of portfolio).\n2. Do not wire the Add button yet.\n3. Inspect to count li elements."},"lessons/m01/d07.md":{"md":"# M1-D7 — Accessibility audit with AI\n\n## Today's summary\n\nYou practice the AI-native loop: AI finds issues, you fix them by typing.\n\n## What this is & why you need it\n\nFounders who paste 'fix my file' learn nothing. Founders who use AI as a reviewer ship better products faster.\n\n## How the session works (90 min)\n\nAsk audit · write the issue list · fix each by hand · re-audit\n\n## Tool steps (do these in order)\n\n1. Ask mode: \"Audit @file for a11y. List issues. Do not edit.\"\n2. You edit the file.\n3. Second Ask audit.\n\n## The concept\n\nCommon fixes: labels, alt text, heading order, contrast (you'll do more with CSS later), button types. The skill is **driving** the AI, not obeying it blindly — disagree if a suggestion is wrong.\n\n\n## Where beginners go wrong\n\n1. Letting Agent apply the whole patch unread.\n2. Fixing only the first issue and calling it done.\n3. Accepting nonsense suggestions without understanding.\n\n## Today's exercise\n\n**Exercise M1-D7:** Audit → you fix → re-audit clean. Self-check: second audit has no major issues.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"Name two accessibility issues AI found and why each mattered.\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You practice the AI-native loop: AI finds issues, you fix them by typing.","process":"Ask audit · write the issue list · fix each by hand · re-audit","tools":"1. Ask mode: \"Audit @file for a11y. List issues. Do not edit.\"\n2. You edit the file.\n3. Second Ask audit."},"lessons/m01/d08.md":{"md":"# M1-D8 — Project Saturday — portfolio HTML\n\n## Today's summary\n\nYou assemble a one-page portfolio in semantic HTML — shippable structure, CSS next week.\n\n## What this is & why you need it\n\nSaturday is for artifacts. A public story of who you are beats another tutorial file.\n\n## How the session works (90 min)\n\n10 min plan sections · build · read aloud outline · commit\n\n## Tool steps (do these in order)\n\n1. Single index.html.\n2. Real project names from your work.\n3. git commit with a message you wrote.\n\n## The concept\n\nMinimum portfolio: identity, proof (3 projects), contact. Semantics over beauty today.\n\n\n## Where beginners go wrong\n\n1. Inventing fake projects when you have real ones.\n2. Spending the day choosing fonts (that's CSS — later).\n3. Not committing.\n\n## Today's exercise\n\n**Exercise M1-D8:** Semantic portfolio: intro, 3 projects, contact. Self-check: h1 then project h2s.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"Pitch this page in two sentences as if to a B2B client.\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You assemble a one-page portfolio in semantic HTML — shippable structure, CSS next week.","process":"10 min plan sections · build · read aloud outline · commit","tools":"1. Single index.html.\n2. Real project names from your work.\n3. git commit with a message you wrote."},"lessons/m01/d09.md":{"md":"# M1-D9 — CSS selectors and text\n\n## Today's summary\n\nYou attach a stylesheet and control type and color without breaking HTML structure.\n\n## What this is & why you need it\n\nHTML is structure; CSS is finishes. Separating them lets you restyle without rebuilding the frame.\n\n## How the session works (90 min)\n\nLink CSS file · selectors · style portfolio text · verify unlink breaks styles\n\n## Tool steps (do these in order)\n\n1. Create styles.css.\n2. Add <link rel=\"stylesheet\" href=\"styles.css\"> in head.\n3. Edit CSS, refresh browser.\n\n## The concept\n\nA **selector** targets elements (`h1`, `.card`, `#main`). Properties assign values (`color`, `font-size`, `margin`). Prefer classes for reusable patterns.\n\n## Annotated example\n\n```\n/* styles.css */\nbody {\n  font-family: system-ui, sans-serif; /* readable default */\n  line-height: 1.5;\n  color: #1a1a1a;\n}\nh1 {\n  font-size: 2rem;\n  letter-spacing: -0.02em;\n}\na {\n  color: #0f766e; /* teal accent — same family as your learning app */\n}\n```\n\n## Where beginners go wrong\n\n1. Inline styles everywhere (hard to reuse).\n2. Styling with h1 for size instead of a class when needed.\n3. Wrong path in href so CSS never loads.\n\n## Today's exercise\n\n**Exercise M1-D9:** External CSS on portfolio. Self-check: link tag present; edits affect page.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"What's the difference between an element selector and a class selector?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You attach a stylesheet and control type and color without breaking HTML structure.","process":"Link CSS file · selectors · style portfolio text · verify unlink breaks styles","tools":"1. Create styles.css.\n2. Add <link rel=\"stylesheet\" href=\"styles.css\"> in head.\n3. Edit CSS, refresh browser."},"lessons/m01/d10.md":{"md":"# M1-D10 — The box model\n\n## Today's summary\n\nYou predict how wide a box will render — the skill that ends most 'why is my layout broken?' pain.\n\n## What this is & why you need it\n\nEvery element is a box: content + padding + border + margin. Misread this and flex/grid feel haunted.\n\n## How the session works (90 min)\n\nDraw boxes on paper · lesson · three-box experiment · predict · confirm in DevTools\n\n## Tool steps (do these in order)\n\n1. DevTools → select element → box model diagram.\n2. Toggle box-sizing in CSS.\n3. Ask only after you predicted.\n\n## The concept\n\nDefault `content-box`: width applies to content only; padding/border add outside. `border-box`: width includes padding and border (usually what you want). Margin is outside the border — clearance from neighbors.\n\n## Annotated example\n\n```\n.a { box-sizing: content-box; width: 200px; padding: 20px; border: 5px solid; }\n.b { box-sizing: border-box;  width: 200px; padding: 20px; border: 5px solid; }\n/* .a total width = 200+40+10 = 250px; .b total = 200px */\n```\n\n## Where beginners go wrong\n\n1. Assuming width includes padding.\n2. Using margin to 'center' without understanding flex yet.\n3. Not verifying in DevTools.\n\n## Today's exercise\n\n**Exercise M1-D10:** Three boxes; predict widths; confirm. Self-check: explanation in Ask mode is correct.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"Why do two elements both with width 200px look different widths?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You predict how wide a box will render — the skill that ends most 'why is my layout broken?' pain.","process":"Draw boxes on paper · lesson · three-box experiment · predict · confirm in DevTools","tools":"1. DevTools → select element → box model diagram.\n2. Toggle box-sizing in CSS.\n3. Ask only after you predicted."},"lessons/m01/d11.md":{"md":"# M1-D11 — Flexbox I — axes and centering\n\n## Today's summary\n\nYou center content with flex and can name main vs cross axis.\n\n## What this is & why you need it\n\nFlexbox is how most UI rows and centering work. One solid mental model beats twenty Stack Overflow snippets.\n\n## How the session works (90 min)\n\nBox model 2-min recall · flex lesson · center a card · say axes out loud\n\n## Tool steps (do these in order)\n\n1. Parent with display:flex.\n2. justify-content and align-items.\n3. DevTools flex overlay if available.\n\n## The concept\n\nOn a flex container, **main axis** direction is row (default) or column. `justify-content` packs along main; `align-items` along cross. Centering a card in the viewport: column or row flex on a full-height parent with both set to center.\n\n## Annotated example\n\n```\nbody {\n  min-height: 100vh;\n  display: flex;\n  justify-content: center; /* main axis */\n  align-items: center;     /* cross axis */\n}\n```\n\n## Where beginners go wrong\n\n1. Putting display:flex on the child instead of the parent.\n2. Confusing justify and align.\n3. Using absolute positioning when flex is enough.\n\n## Today's exercise\n\n**Exercise M1-D11:** Center a project card in the viewport with flex only.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"In my centering layout, which axis is main and which is cross?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You center content with flex and can name main vs cross axis.","process":"Box model 2-min recall · flex lesson · center a card · say axes out loud","tools":"1. Parent with display:flex.\n2. justify-content and align-items.\n3. DevTools flex overlay if available."},"lessons/m01/d12.md":{"md":"# M1-D12 — Flexbox II — wrap and gap\n\n## Today's summary\n\nYou lay out three project cards that wrap on small screens.\n\n## What this is & why you need it\n\nReal portfolios are rows of cards. Wrap + gap is the minimum professional layout.\n\n## How the session works (90 min)\n\nCenter recall · wrap lesson · three cards · resize window test\n\n## Tool steps (do these in order)\n\n1. flex-wrap: wrap; gap: 1rem;\n2. Narrow the browser.\n3. No horizontal scrollbar allowed.\n\n## The concept\n\n`flex-wrap: wrap` lets items move to the next line. `gap` spaces items without margin tricks. Card children need a sensible `flex-basis` or width so they wrap predictably.\n\n## Annotated example\n\n```\n.grid {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 1rem;\n}\n.card {\n  flex: 1 1 220px; /* grow, shrink, basis */\n  border: 1px solid #ccc;\n  padding: 1rem;\n}\n```\n\n## Where beginners go wrong\n\n1. Fixed widths that force overflow on mobile.\n2. Margins instead of gap (harder to keep even).\n3. Forgetting wrap.\n\n## Today's exercise\n\n**Exercise M1-D12:** Three wrapping project cards. Self-check: wrap at narrow widths.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"What does flex: 1 1 220px mean in plain words?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You lay out three project cards that wrap on small screens.","process":"Center recall · wrap lesson · three cards · resize window test","tools":"1. flex-wrap: wrap; gap: 1rem;\n2. Narrow the browser.\n3. No horizontal scrollbar allowed."},"lessons/m01/d13.md":{"md":"# M1-D13 — Docs literacy — MDN HTML elements\n\n## Today's summary\n\nOnce this milestone, you practice reading official docs — a career skill.\n\n## What this is & why you need it\n\nTutorials go stale. Docs are the source of truth. Skimming MDN poorly is still better than only chatting with AI.\n\n## How the session works (90 min)\n\nOpen MDN · skim with a purpose · write 3 answers · Ask grades\n\n## Tool steps (do these in order)\n\n1. Browser only for the docs page.\n2. learning-log.md for answers.\n3. Ask mode to grade — not to fetch the answers first.\n\n## The concept\n\nOfficial docs list elements, attributes, accessibility notes. You don't memorize the catalog — you learn to **look up** and extract what you need.\n\n\n## Where beginners go wrong\n\n1. Skimming without writing answers.\n2. Asking Cursor to summarize instead of reading.\n3. Bookmarking nothing for later.\n\n## Today's exercise\n\n**Exercise M1-D13:** Read the MDN HTML elements reference (linked in PLAN). Answer 3 questions in learning-log.md.\n\n## Docs literacy\n\nRead this page only: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements\n\nAnswer in learning-log.md:\n1. Difference between section and div?\n2. When is article appropriate?\n3. Name one element you haven't used and what it's for.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"What did the docs clarify that my lesson didn't?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"Once this milestone, you practice reading official docs — a career skill.","process":"Open MDN · skim with a purpose · write 3 answers · Ask grades","tools":"1. Browser only for the docs page.\n2. learning-log.md for answers.\n3. Ask mode to grade — not to fetch the answers first."},"lessons/m01/d14.md":{"md":"# M1-D14 — Saturday — style the portfolio\n\n## Today's summary\n\nNo new theory: make the portfolio look intentional and commit.\n\n## What this is & why you need it\n\nShipping polish teaches taste. Constraint: one AI design suggestion only.\n\n## How the session works (90 min)\n\nApply flex + type · Ask for one critique · apply that one · commit\n\n## Tool steps (do these in order)\n\n1. styles.css only.\n2. Ask: one critique.\n3. git commit.\n\n## The concept\n\nConsistency beats novelty: one font stack, one accent, spacing scale (e.g. 0.5/1/2rem).\n\n\n## Where beginners go wrong\n\n1. Chasing perfect.\n2. Ten AI suggestions.\n3. Not viewing on phone width.\n\n## Today's exercise\n\n**Exercise M1-D14:** Intentional portfolio styling; one AI critique applied.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"What single design choice improved clarity the most?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"No new theory: make the portfolio look intentional and commit.","process":"Apply flex + type · Ask for one critique · apply that one · commit","tools":"1. styles.css only.\n2. Ask: one critique.\n3. git commit."},"lessons/m01/d15.md":{"md":"# M1-D15 — Responsive basics\n\n## Today's summary\n\nYour portfolio works on a phone-width screen.\n\n## What this is & why you need it\n\nClients open links on phones. Horizontal scroll looks broken.\n\n## How the session works (90 min)\n\nDevice toolbar · media query · fix overflow · retest three widths\n\n## Tool steps (do these in order)\n\n1. DevTools Ctrl+Shift+M.\n2. @media (min-width: …) mobile-first.\n3. meta viewport in head if missing.\n\n## The concept\n\n**Mobile-first:** base styles for small screens; add complexity at breakpoints. Viewport meta tells mobile browsers not to shrink a desktop layout blindly.\n\n## Annotated example\n\n```\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n\n/* css */\n@media (min-width: 800px) {\n  .grid { flex-wrap: nowrap; }\n}\n```\n\n## Where beginners go wrong\n\n1. Missing viewport meta.\n2. Only testing desktop.\n3. Fixed pixel widths on containers.\n\n## Today's exercise\n\n**Exercise M1-D15:** No horizontal scroll at 375/768/1200.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"What is mobile-first in one sentence?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"Your portfolio works on a phone-width screen.","process":"Device toolbar · media query · fix overflow · retest three widths","tools":"1. DevTools Ctrl+Shift+M.\n2. @media (min-width: …) mobile-first.\n3. meta viewport in head if missing."},"lessons/m01/d16.md":{"md":"# M1-D16 — Focus states and light motion\n\n## Today's summary\n\nKeyboard users can see where they are; links don't jump harshly.\n\n## What this is & why you need it\n\nAccessibility is product quality. Focus rings are not optional chrome.\n\n## How the session works (90 min)\n\nTab through page · add :focus-visible · optional transition · retest\n\n## Tool steps (do these in order)\n\n1. Keyboard only navigation.\n2. :focus-visible styles.\n3. transition on color 0.15s.\n\n## The concept\n\n`:focus-visible` styles keyboard focus without punishing mouse users. Short transitions signal change without gimmicks.\n\n## Annotated example\n\n```\na:focus-visible, button:focus-visible {\n  outline: 2px solid #0f766e;\n  outline-offset: 3px;\n}\na { transition: color 0.15s ease; }\n```\n\n## Where beginners go wrong\n\n1. outline: none without a replacement.\n2. Slow flashy animations.\n3. Ignoring keyboard.\n\n## Today's exercise\n\n**Exercise M1-D16:** Clear Tab focus on interactive elements.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"Why is outline:none dangerous?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"Keyboard users can see where they are; links don't jump harshly.","process":"Tab through page · add :focus-visible · optional transition · retest","tools":"1. Keyboard only navigation.\n2. :focus-visible styles.\n3. transition on color 0.15s."},"lessons/m01/d17.md":{"md":"# M1-D17 — AEC product hero copy\n\n## Today's summary\n\nYou write a B2B problem headline for a non-configurator product idea.\n\n## What this is & why you need it\n\nFounders who can't state the problem don't get meetings. This is Track-2 muscle before Track-2 starts.\n\n## How the session works (90 min)\n\nPick a pain from ShapeDiver patterns (no client secrets) · write hero · CTA · friend test\n\n## Tool steps (do these in order)\n\n1. HTML section.\n2. Plain language.\n3. Ask to critique fluff — you rewrite.\n\n## The concept\n\nFormula: who · painful job · outcome. Avoid feature lists. Not a configurator — respect your ShapeDiver lane.\n\n## Annotated example\n\n```\n<section>\n  <h2>Stop re-typing model issues into email threads</h2>\n  <p>For BIM coordinators who need a single list of clashes with owners and due dates.</p>\n  <a href=\"#\">Join the waitlist</a>\n</section>\n```\n\n## Where beginners go wrong\n\n1. Feature soup.\n2. Configurator idea.\n3. Jargon nobody outside your firm uses.\n\n## Today's exercise\n\n**Exercise M1-D17:** Hero + CTA; friend can state the problem.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"Who is the user and what job are they hiring this product for?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You write a B2B problem headline for a non-configurator product idea.","process":"Pick a pain from ShapeDiver patterns (no client secrets) · write hero · CTA · friend test","tools":"1. HTML section.\n2. Plain language.\n3. Ask to critique fluff — you rewrite."},"lessons/m01/d18.md":{"md":"# M1-D18 — GitHub Pages deploy\n\n## Today's summary\n\nYou turn the repo into a public URL.\n\n## What this is & why you need it\n\nLive links are proof. Local-only work doesn't count for Milestone 1.\n\n## How the session works (90 min)\n\nPush latest · Settings → Pages · wait · open URL\n\n## Tool steps (do these in order)\n\n1. GitHub repo Settings → Pages.\n2. Branch main, folder / root.\n3. Wait 1–2 minutes.\n\n## The concept\n\nGitHub Pages hosts static files (HTML/CSS/JS) from your repo. Same mechanism as this learning app.\n\n\n## Where beginners go wrong\n\n1. Wrong branch.\n2. Capitalization in paths breaks on Pages.\n3. Caching — hard refresh.\n\n## Today's exercise\n\n**Exercise M1-D18:** Pages enabled; URL loads.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"What kinds of apps can Pages host, and what needs a real server later?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You turn the repo into a public URL.","process":"Push latest · Settings → Pages · wait · open URL","tools":"1. GitHub repo Settings → Pages.\n2. Branch main, folder / root.\n3. Wait 1–2 minutes."},"lessons/m01/d19.md":{"md":"# M1-D19 — Production bugfix\n\n## Today's summary\n\nYou test on a phone and fix path/case issues.\n\n## What this is & why you need it\n\nProduction is the real exam. Catching breaks before you call M1 done is professionalism.\n\n## How the session works (90 min)\n\nPhone open · note bugs · fix · push · retest\n\n## Tool steps (do these in order)\n\n1. Phone browser.\n2. git pull/push cycle.\n3. Ask: interpret an error — you apply fix.\n\n## The concept\n\nServers can be case-sensitive. Relative paths differ from `file://`. Always test the live URL.\n\n\n## Where beginners go wrong\n\n1. Only testing locally.\n2. Huge unrelated refactors.\n3. Not committing the fix.\n\n## Today's exercise\n\n**Exercise M1-D19:** Phone OK on live URL.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"What broke in production that worked locally?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You test on a phone and fix path/case issues.","process":"Phone open · note bugs · fix · push · retest","tools":"1. Phone browser.\n2. git pull/push cycle.\n3. Ask: interpret an error — you apply fix."},"lessons/m01/d20.md":{"md":"# M1-D20 — Ship Milestone 1\n\n## Today's summary\n\nYou close M1: DoD checklist, Saturday review redo, export progress.\n\n## What this is & why you need it\n\nMilestones end with decisions, not endless polish.\n\n## How the session works (90 min)\n\nRedo M1-D3 from scratch · tick DoD · export progress.json · commit\n\n## Tool steps (do these in order)\n\n1. Throwaway file for redo.\n2. Dashboard Projects + Export.\n3. Celebrate briefly.\n\n## The concept\n\nDefinition of done protects you from perfectionism. Spaced redo proves learning stuck.\n\n\n## Where beginners go wrong\n\n1. Skipping the redo.\n2. Redeploying instead of checking DoD.\n3. Not exporting progress.\n\n## Today's exercise\n\n**Exercise M1-D20:** Close M1 per PLAN definition of done + redo M1-D3.\n\n## Explain it back\n\nIn Cursor **Ask mode**, answer: \"What can you explain now that you couldn't on Jul 17?\"\nAsk Cursor to grade you out of 10 and correct anything wrong.\n","summary":"You close M1: DoD checklist, Saturday review redo, ish a milestone, copy this into Cursor **Agent** mode (with the repo open):\r\n\r\n```\r\nGenerate lessons for Milestone N of @PLAN.md into lessons/m0N/d01.md …\r\n\r\nRules from GETTING-STARTED.md standing rules and PLAN.md lesson template:\r\n- One concept per day, 300–600 words\r\n- Sections: Today's summary · What/why · How the session works · Tool steps · Concept · Annotated code (if any) · Beginner mistakes · Exercise · Explain it back\r\n- AEC analogies; exercises typed-by-learner; self-check verifiable alone\r\n- Exactly one docs-literacy day this milestone with one official URL + 3 questions\r\n- AI-native practice line each day (hints / diff review / debug with Ask)\r\n- Do not write solutions into the lesson\r\n\r\nThen run: node sync.mjs\r\nCommit the new lessons + dashboard.html.\r\n```\r\n\r\nFill in N and the milestone title from PLAN.md.\r\n\r\n---\r\n\r\n## 7. Progress backup\r\n\r\nIn the dashboard: **Export progress** weekly (Saturday). Commit `progress.json` with your work. Import restores after a browser reset. Use **one browser** as the canonical tracker.\r\n\r\n---\r\n\r\n## 8. Reminders\r\n\r\nWindows task `FullstackLearning-DailyReminder` opens the live URL Mon–Sat ~10:30. Manage with `schtasks` (see earlier setup) or disable if noisy.\r\n\r\n---\r\n\r\n## Project recipes (cheat sheet)\r\n\r\n**Static HTML:** folder → `index.html` → Live Preview or double-click → later GitHub Pages.  \r\n**Next.js + TS:** `npx create-next-app@latest` → TypeScript → App Router → `npm run dev`.  \r\n**Neon:** neon.tech free project → connection string → `.env` / Vercel env — never commit secrets.\r\n"},"syncedAt":"2026-07-16T10:44:50.082Z"};

<script>
"use strict";
const $=s=>document.querySelector(s);
const LS="fsp3";
let viewIdx=0;
let timer=null, remain=90*60, running=false;

function load(){ try{ return Object.assign({done:{},logs:{},reviews:[],urls:{},lastExport:0}, JSON.parse(localStorage.getItem(LS)||"{}")); }catch{ return {done:{},logs:{},reviews:[],urls:{},lastExport:0}; } }
const state=load();
function save(){ localStorage.setItem(LS, JSON.stringify(state)); }

const DAYMS=864e5;
function iso(d){ const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function fromISO(s){ const[a,b,c]=s.split("-").map(Number); return new Date(a,b-1,c); }
function todayISO(){ return iso(new Date()); }
function addDays(s,n){ const d=fromISO(s); d.setDate(d.getDate()+n); return iso(d); }
function isSunday(s){ return fromISO(s).getDay()===0; }
function fmt(s){ return fromISO(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); }
function fmtLong(s){ return fromISO(s).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(s){
  return s.replace(/`([^`]+)`/g,(m,c)=>"<code>"+c+"</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMD(src){
  const lines=src.split("\n"); let out=[],i=0;
  while(i<lines.length){
    let l=lines[i];
    if(l.startsWith("```")){ let code=[]; i++; while(i<lines.length&&!lines[i].startsWith("```")){code.push(lines[i]);i++;} i++; out.push("<pre><code>"+esc(code.join("\n"))+"</code></pre>"); continue; }
    if(/^#{1,4} /.test(l)){ const n=l.match(/^#+/)[0].length; out.push(`<h${n}>`+inline(esc(l.replace(/^#+ /,"")))+`</h${n}>`); i++; continue; }
    if(/^---+\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(/^(\s*)[-*] /.test(l)){ let items=[]; while(i<lines.length&&/^(\s*)[-*] /.test(lines[i])){items.push(lines[i].replace(/^(\s*)[-*] /,""));i++;} out.push("<ul>"+items.map(x=>"<li>"+inline(esc(x))+"</li>").join("")+"</ul>"); continue; }
    if(/^\s*\d+\. /.test(l)){ let items=[]; while(i<lines.length&&/^\s*\d+\. /.test(lines[i])){items.push(lines[i].replace(/^\s*\d+\. /,""));i++;} out.push("<ol>"+items.map(x=>"<li>"+inline(esc(x))+"</li>").join("")+"</ol>"); continue; }
    if(l.trim()===""){ i++; continue; }
    let para=[]; while(i<lines.length&&lines[i].trim()!==""&&!/^(#|```|- |\* |\d+\. |---)/.test(lines[i])){para.push(lines[i]);i++;}
    if(!para.length){ para=[l]; i++; }
    out.push("<p>"+inline(esc(para.join(" ")))+"</p>");
  }
  return out.join("\n");
}

function P(){ return window.PLAN_DATA; }
function days(){ return P().days; }
function dayAt(i){ return days()[i]; }
function idxForDate(s){ return days().findIndex(d=>d.date===s); }
function ms(id){ return P().milestones.find(m=>m.id===id); }

function scheduleDelta(){
  const t=todayISO();
  if(t<P().meta.start) return {kind:"pre", due:0, done:0, delta:0};
  const due=days().filter(d=>d.date<=t).length;
  const done=days().filter(d=>d.date<=t&&state.done[d.date]).length;
  return {kind:"run", due, done, delta: done-due};
}

function isoWeekKey(s){ const d=fromISO(s); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return iso(d); }
function streak(){
  const t=todayISO(); let s=0, d=t, freezes={};
  if(!state.done[t]) d=addDays(d,-1);
  while(d>=P().meta.start){
    if(isSunday(d)){ d=addDays(d,-1); continue; }
    if(state.done[d]){ s++; d=addDays(d,-1); continue; }
    const wk=isoWeekKey(d);
    if(!freezes[wk]){ freezes[wk]=true; d=addDays(d,-1); continue; }
    break;
  }
  return {n:s, frozen:Object.keys(freezes).length>0&&s>0};
}

function scheduleReviews(day){
  [7,28].forEach(n=>{
    let due=addDays(day.date,n); if(isSunday(due)) due=addDays(due,1);
    if(due>P().meta.mvpLaunch) return;
    if(state.reviews.some(r=>r.src===day.date&&r.gap===n)) return;
    state.reviews.push({src:day.date,gap:n,due,label:day.title,done:false});
  });
}

function currentMilestoneId(t){
  const d=days().find(x=>x.date>=t)||days()[days().length-1];
  return d.m;
}

function renderStats(){
  const t=todayISO(), total=days().length, done=days().filter(d=>state.done[d.date]).length;
  const pct=Math.round(done/total*100), st=streak(), mvp=Math.max(0,Math.round((fromISO(P().meta.mvpLaunch)-fromISO(t))/DAYMS));
  const mid=currentMilestoneId(t<P().meta.start?P().meta.start:t);
  const sd=scheduleDelta();
  let sched="";
  if(sd.kind==="pre") sched=`<span>starts <b>${fmt(P().meta.start)}</b></span>`;
  else if(sd.delta===0) sched=`<span class="ahead"><b>on track</b></span>`;
  else if(sd.delta<0) sched=`<span class="behind"><b>${-sd.delta}d behind</b></span>`;
  else sched=`<span class="ahead"><b>${sd.delta}d ahead</b></span>`;
  $("#statline").innerHTML=
    `<span><b>${pct}%</b> overall</span>`+
    `<span><b>${st.n}</b> streak${st.frozen?' <span class="fz" title="freeze used">❄</span>':""}</span>`+
    `<span>Milestone <b>${mid}</b>/12</span>`+
    `<span><b>${mvp}</b> days to MVP</span>`+sched;
}

function renderBanner(){
  const t=todayISO(); const sd=scheduleDelta(); let html="";
  if(t<P().meta.start){
    html=`Day 1 is <b>${fmtLong(P().meta.start)}</b>. Preview any day with Next — marking complete unlocks after start. Read Docs → GETTING-STARTED today if you haven't.`;
  } else if(sd.delta<0){
    html=`You're <b>${-sd.delta} day(s) behind</b> schedule (${sd.done}/${sd.due} due days done). Catch up on pending syllabus items below — or consciously skip and stay honest.`;
  } else if(sd.delta>0){
    html=`You're <b>${sd.delta} day(s) ahead</b>. Keep quality high — use spare time on review-queue redos or founder notes (from M4).`;
  } else if(state.lastExport && Date.now()-state.lastExport>7*DAYMS){
    html=`Last progress export is over a week old — Export and commit <code>progress.json</code>.`;
  }
  const el=$("#banner");
  if(!html){ el.innerHTML=""; return; }
  el.innerHTML=`<div class="banner ${sd.delta<0?"behind":sd.delta>0?"ahead":""}">${html}</div>`;
}

function defaultViewIdx(){
  const t=todayISO();
  if(t<P().meta.start) return 0;
  if(isSunday(t)){
    const y=addDays(t,-1); const i=idxForDate(y); return i>=0?i:0;
  }
  const i=idxForDate(t); return i>=0?i:days().findIndex(d=>d.date>t);
}

function renderNow(){
  const day=dayAt(viewIdx); if(!day) return;
  const t=todayISO();
  const L=day.lesson&&P().lessons[day.lesson];
  const m=ms(day.m);
  let html=`<div class="eyebrow"><span>${day.id} · ${fmt(day.date).toUpperCase()}</span><span class="ph">Milestone ${day.m}/12</span></div>`;
  html+=`<h1>${esc(day.title)}</h1>`;
  html+=`<p class="muted tiny">Shipped outcome this milestone: ${esc(m.shipped)}</p>`;

  if(L){
    html+=`<div class="brief"><h3>What you'll learn</h3><p>${inline(esc(L.summary||""))}</p></div>`;
    html+=`<div class="brief"><h3>How the session works</h3><p>${inline(esc(L.process||""))}</p></div>`;
    html+=`<div class="brief"><h3>Tool steps</h3>${renderMD(L.tools||"")}</div>`;
  } else if(day.synthetic){
    html+=`<div class="brief"><h3>Lessons not generated yet</h3><p>Use <b>Copy generate-lessons prompt</b> below, commit, run <code>node sync.mjs</code>, refresh. Until then follow PLAN.md for this milestone.</p></div>`;
  }

  html+=`<div class="nav-row">
    <button class="btn ghost" id="prev-day" ${viewIdx<=0?"disabled":""}>← Prev</button>
    <button class="btn ghost" id="next-day" ${viewIdx>=days().length-1?"disabled":""}>Next →</button>
    <button class="btn" id="complete-next" ${t<P().meta.start?"disabled":""}>${state.done[day.date]?"Completed ✓ · Next":"Complete & next"}</button>
  </div>`;
  html+=`<div class="donecheck"><input type="checkbox" id="done-day" ${state.done[day.date]?"checked":""} ${t<P().meta.start?"disabled":""}>
    <span>Mark this day done</span><span class="muted tiny">— schedules redo at +7 and +28 days</span></div>`;
  $("#now").innerHTML=html;

  $("#prev-day").onclick=()=>{ viewIdx--; renderAll(); };
  $("#next-day").onclick=()=>{ viewIdx++; renderAll(); };
  $("#done-day").onchange=e=>{
    if(e.target.checked){ state.done[day.date]=true; scheduleReviews(day); }
    else delete state.done[day.date];
    save(); renderAll();
  };
  $("#complete-next").onclick=()=>{
    if(t>=P().meta.start){ state.done[day.date]=true; scheduleReviews(day); save(); }
    if(viewIdx<days().length-1) viewIdx++;
    renderAll(); toast("Saved · showing next day");
  };

  if(L) $("#lesson-body").innerHTML=renderMD(L.md);
  else $("#lesson-body").innerHTML=`<p class="muted">No embedded lesson for this day yet. See <b>PLAN.md</b> exercises and generate lessons when you reach this milestone.</p>`;

  renderLog(day.date);
}

function renderLog(date){
  const l=state.logs[date]||{t:"",w:""};
  $("#log-card").innerHTML=`<h2>Daily log</h2>
    <label class="small">What I did / what confused me</label>
    <textarea id="log-t">${esc(l.t)}</textarea>
    <label class="small">Weak-spot tag (optional)</label>
    <input type="text" id="log-w" placeholder="e.g. box model, async, prisma" value="${esc(l.w)}">
    <div class="nav-row"><button class="btn ghost" id="log-save">Save log</button></div>`;
  $("#log-save").onclick=()=>{
    state.logs[date]={t:$("#log-t").value,w:$("#log-w").value};
    save(); toast("Log saved");
  };
}

function renderReviews(){
  const t=todayISO();
  const due=state.reviews.filter(r=>!r.done&&r.due<=t);
  const el=$("#review-card");
  if(!due.length){ el.style.display="none"; return; }
  el.style.display="block";
  el.innerHTML=`<h2>Review queue · redo from scratch</h2>`+due.map((r,i)=>`
    <div class="syl-day"><input type="checkbox" data-ri="${i}"> <span>${esc(r.label)}</span>
    <span class="tiny muted" style="margin-left:auto">${r.gap}d review · from ${fmt(r.src)}</span></div>`).join("");
  el.querySelectorAll("input").forEach(inp=>{
    inp.onchange=()=>{
      const item=due[+inp.dataset.ri];
      const real=state.reviews.find(x=>x.src===item.src&&x.gap===item.gap);
      if(real) real.done=true; save(); renderReviews();
    };
  });
}

function renderHomeTimeline(){
  const t=todayISO();
  const cur=currentMilestoneId(t<P().meta.start?P().meta.start:t);
  $("#home-timeline").innerHTML=P().milestones.map(m=>{
    const mdays=days().filter(d=>d.m===m.id);
    const allDone=mdays.length&&mdays.every(d=>state.done[d.date]);
    return `<div class="tl-dot ${allDone?"done":""} ${m.id===cur?"cur":""}" title="M${m.id}: ${esc(m.name)}" data-m="${m.id}"></div>`;
  }).join("");
  $("#home-tl-label").textContent=`Milestone ${cur}: ${ms(cur).name}`;
  $("#home-timeline").querySelectorAll(".tl-dot").forEach(d=>{
    d.onclick=()=>{
      const i=days().findIndex(x=>x.m===+d.dataset.m);
      if(i>=0){ const y=window.scrollY; viewIdx=i; renderAll(); window.scrollTo(0,y); }
    };
  });
  const m=ms(dayAt(viewIdx).m);
  const list=days().filter(d=>d.m===m.id);
  $("#home-syllabus").innerHTML=`<p class="tiny muted" style="margin-bottom:8px">${fmt(m.start)} → ${fmt(m.end)} · ${list.filter(d=>state.done[d.date]).length}/${list.length} days</p>`+
    list.map(d=>{
      const viewing=d.date===dayAt(viewIdx).date;
      return `<div class="syl-day ${state.done[d.date]?"done-d":""} ${viewing?"viewing":""}">
        <input type="checkbox" ${state.done[d.date]?"checked":""} data-d="${d.date}" ${todayISO()<P().meta.start?"disabled":""}>
        <div><button type="button" class="syl-link" data-go="${d.date}">${esc(d.id)} · ${esc(d.title)}</button>
        <div class="tiny muted">${fmt(d.date)}</div></div></div>`;
    }).join("");
  $("#home-syllabus").querySelectorAll("[data-go]").forEach(a=>{
    a.onclick=()=>{ const i=idxForDate(a.dataset.go); if(i>=0){ const y=window.scrollY; viewIdx=i; renderAll(); window.scrollTo(0,y); } };
  });
  $("#home-syllabus").querySelectorAll("input[data-d]").forEach(cb=>{
    cb.onchange=()=>{
      const d=days().find(x=>x.date===cb.dataset.d);
      if(cb.checked){ state.done[d.date]=true; scheduleReviews(d); } else delete state.done[d.date];
      save(); renderAll();
    };
  });
}

function renderDim(){
  const phases=[{t:0,l:"0:00",s:"Review"},{t:10,l:"0:10",s:"Lesson"},{t:40,l:"0:40",s:"Build"},{t:85,l:"1:25",s:"Commit"},{t:90,l:"1:30",s:""}];
  const elapsed=90*60-remain;
  const pct=Math.min(100,(elapsed/(90*60))*100);
  let cur="Review";
  if(elapsed>=85*60) cur="Commit"; else if(elapsed>=40*60) cur="Build"; else if(elapsed>=10*60) cur="Lesson";
  $("#dim").innerHTML=`<div class="dim-track"><div class="dim-line"></div><div class="dim-fill" style="width:${pct}%"></div>
    ${phases.map(p=>`<span class="dim-lab" style="left:${(p.t/90)*100}%">${p.l}</span>`).join("")}
    ${phases.filter(p=>p.s).map(p=>`<span class="dim-seg ${p.s===cur?"cur":""}" style="left:${(p.t/90)*100}%">${p.s}</span>`).join("")}
  </div>`;
  $("#phase-tag").textContent=running?`Phase: ${cur}`:"";
  const m=Math.floor(remain/60), s=remain%60;
  $("#clock").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function renderRoadmap(){
  $("#rd-list").innerHTML=P().milestones.map(m=>{
    const list=days().filter(d=>d.m===m.id);
    const done=list.filter(d=>state.done[d.date]).length;
    const cur=m.id===dayAt(viewIdx).m;
    return `<div class="ms-block ${cur?"cur-ms":""}">
      <div class="eyebrow"><span>Milestone ${m.id}</span><span>${done}/${list.length}</span></div>
      <strong>${esc(m.name)}</strong>
      <p class="tiny muted">${fmt(m.start)} → ${fmt(m.end)} · ${esc(m.shipped)}</p>
      <ul class="tiny">${m.dod.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul>
      <button class="btn ghost" data-jump="${m.id}">Open first day</button>
    </div>`;
  }).join("");
  $("#rd-list").querySelectorAll("[data-jump]").forEach(b=>{
    b.onclick=()=>{ const i=days().findIndex(d=>d.m===+b.dataset.jump); if(i>=0){ viewIdx=i; switchPage("today"); renderAll(); } };
  });
}

function renderProjects(){
  const mvp=P().meta.mvp;
  $("#mvp-box").innerHTML=`<p><b>User:</b> ${esc(mvp.user)}</p>
    <p><b>Workflow:</b> ${esc(mvp.workflow)}</p>
    <p><b>AI:</b> ${esc(mvp.ai)}</p>
    <p class="tiny muted"><b>Out of scope:</b> ${esc(mvp.outOfScope)}</p>
    <p class="tiny">Launch target: <b>${fmtLong(P().meta.mvpLaunch)}</b></p>`;
  $("#proj-list").innerHTML=P().milestones.map(m=>{
    const url=state.urls[m.id]||"";
    return `<div class="card"><div class="eyebrow"><span>Milestone ${m.id}</span></div>
      <h2>${esc(m.name)}</h2>
      <p class="tiny muted">${esc(m.shipped)}</p>
      <label class="small">Live URL</label>
      <input type="url" data-u="${m.id}" placeholder="https://…" value="${esc(url)}">
      ${url?`<p class="tiny" style="margin-top:8px"><a href="${esc(url)}" target="_blank">Open ↗</a></p>`:""}
    </div>`;
  }).join("");
  $("#proj-list").querySelectorAll("input[data-u]").forEach(inp=>{
    inp.onchange=()=>{ state.urls[inp.dataset.u]=inp.value.trim(); save(); };
  });
}

function renderDocs(){
  const md=P().docs["GETTING-STARTED.md"]||"# Missing GETTING-STARTED.md — run node sync.mjs";
  $("#doc-body").innerHTML=renderMD(md);
}

function weakSpots(){
  return Object.values(state.logs).map(l=>l.w).filter(Boolean).slice(-3);
}

function wirePrompts(){
  $("#p-quiz").onclick=()=>{
    const day=dayAt(viewIdx); const weak=weakSpots();
    const text=`Quiz me for 10 minutes on "${day.title}" (Milestone ${day.m}, ${day.id}). Also ask one question from 4+ weeks ago or my review queue. One question at a time; wait for my answer; keep score. Weak spots lately: ${weak.join(", ")||"none logged"}. Don't accept vague answers.`;
    navigator.clipboard.writeText(text).then(()=>toast("Quiz prompt copied"));
  };
  $("#p-gen").onclick=()=>{
    const day=dayAt(viewIdx);
    const text=`Generate lessons for Milestone ${day.m} of @PLAN.md into lessons/m${String(day.m).padStart(2,"0")}/d01.md … following GETTING-STARTED.md standing rules and the lesson template (summary, session process, tool steps, concept, code, mistakes, exercise, explain-back). One docs-literacy day with one official URL. Then run node sync.mjs and commit. Weak spots: ${weakSpots().join(", ")||"n/a"}.`;
    navigator.clipboard.writeText(text).then(()=>toast("Generate prompt copied"));
  };
}

function switchPage(name){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.p===name));
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id==="page-"+name));
}

function renderAll(){
  if(!P()){ document.body.innerHTML="<p style='padding:2rem'>Run <code>node sync.mjs</code> to inject curriculum data.</p>"; return; }
  renderStats(); renderBanner(); renderNow(); renderDim(); renderReviews(); renderHomeTimeline(); renderRoadmap(); renderProjects();
}

$("#tabs").onclick=e=>{ if(e.target.dataset.p){ switchPage(e.target.dataset.p); if(e.target.dataset.p==="docs") renderDocs(); }};
$("#t-start").onclick=()=>{
  if(running) return;
  running=true; $("#t-start").textContent="Running…";
  timer=setInterval(()=>{ if(remain<=0){ clearInterval(timer); running=false; $("#t-start").textContent="Start session"; toast("90 minutes complete"); return; } remain--; renderDim(); },1000);
};
$("#t-reset").onclick=()=>{ clearInterval(timer); running=false; remain=90*60; $("#t-start").textContent="Start session"; renderDim(); };
$("#btn-export").onclick=()=>{
  state.lastExport=Date.now(); save();
  const blob=new Blob([JSON.stringify({exported:new Date().toISOString(), progress:state},null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="progress.json"; a.click();
  toast("Exported progress.json — commit it");
};
$("#btn-import").onclick=()=>$("#import-file").click();
$("#import-file").onchange=ev=>{
  const f=ev.target.files[0]; if(!f) return;
  f.text().then(t=>{ try{ const p=JSON.parse(t); Object.assign(state, p.progress||p); save(); location.reload(); }catch{ alert("Bad progress file"); }});
};

wirePrompts();
viewIdx=Math.max(0, defaultViewIdx());
renderAll();
renderDocs();
</script>
</body>
</html>
